# The template set built into Alert Rules. A template is a rule whose
# instance, written ${instance} in its paths, and the source of its input
# can be left open; using it makes an ordinary rule with the picks filled in.
#
# Limits are typical values for a 12 V cruising boat, in SI units: volts,
# kelvin, pascal, hertz, seconds, and ratios from 0 to 1. Each one is meant
# to be adjusted to the boat when the template is used. In messages,
# {limit}, {duration} and {value} are filled in when the alert is sent.
name: Alert Rules
id: builtin
version: 1.0.0
description: Templates that ship with Alert Rules.
templates:
  # Batteries. Lead-acid and LiFePO4 banks rest at different voltages, so
  # each has its own voltage templates; both share the condition name, as a
  # bank has one chemistry.
  - id: battery-voltage-low
    description: >-
      A lead-acid battery bank's voltage stays below 12.2 V for a minute, a
      warning, and climbs to an alarm below 11.8 V.
    open: [instance]
    condition: voltageLow
    rule:
      name: Battery ${instance} voltage low (lead-acid)
      message: 'Battery ${instance} voltage below {limit}: {value}'
      signal:
        path: electrical.batteries.${instance}.voltage
      detector:
        type: sustained
        direction: below
        steps:
          - { limit: 12.2, priority: warning }
          - { limit: 11.8, priority: alarm }
        duration: 60
        hysteresis: 0.1

  - id: battery-voltage-low-lifepo4
    description: >-
      A LiFePO4 battery bank's voltage stays below 12.8 V for a minute, a
      warning, and climbs to an alarm below 12.0 V, close to empty.
    open: [instance]
    condition: voltageLow
    rule:
      name: Battery ${instance} voltage low (LiFePO4)
      message: 'Battery ${instance} voltage below {limit}: {value}'
      signal:
        path: electrical.batteries.${instance}.voltage
      detector:
        type: sustained
        direction: below
        steps:
          - { limit: 12.8, priority: warning }
          - { limit: 12.0, priority: alarm }
        duration: 60
        hysteresis: 0.1

  - id: battery-voltage-high
    description: >-
      A lead-acid battery bank's voltage stays above 15.0 V for 30 seconds,
      a warning that the charger may be overcharging it, and climbs to an
      alarm above 15.5 V.
    open: [instance]
    condition: voltageHigh
    rule:
      name: Battery ${instance} voltage high (lead-acid)
      message: 'Battery ${instance} voltage above {limit}: {value}'
      signal:
        path: electrical.batteries.${instance}.voltage
      detector:
        type: sustained
        direction: above
        steps:
          - { limit: 15.0, priority: warning }
          - { limit: 15.5, priority: alarm }
        duration: 30
        hysteresis: 0.1

  - id: battery-voltage-high-lifepo4
    description: >-
      A LiFePO4 battery bank's voltage stays above 14.6 V for 10 seconds, a
      warning that it is being charged past full, and climbs to an alarm
      above 14.8 V.
    open: [instance]
    condition: voltageHigh
    rule:
      name: Battery ${instance} voltage high (LiFePO4)
      message: 'Battery ${instance} voltage above {limit}: {value}'
      signal:
        path: electrical.batteries.${instance}.voltage
      detector:
        type: sustained
        direction: above
        steps:
          - { limit: 14.6, priority: warning }
          - { limit: 14.8, priority: alarm }
        duration: 10
        hysteresis: 0.1

  - id: battery-charge-low
    description: >-
      A battery bank's state of charge stays below 30 % for a minute, a
      warning, and climbs to an alarm below 15 %. Needs a battery monitor
      that reports state of charge.
    open: [instance]
    condition: stateOfChargeLow
    rule:
      name: Battery ${instance} charge low
      message: 'Battery ${instance} charge below {limit}: {value}'
      signal:
        path: electrical.batteries.${instance}.capacity.stateOfCharge
      detector:
        type: sustained
        direction: below
        steps:
          - { limit: 0.3, priority: warning }
          - { limit: 0.15, priority: alarm }
        duration: 60
        hysteresis: 0.02

  # Engines. NMEA 2000 engine gateways report the coolant temperature as the
  # engine's temperature, so that is the path watched.
  - id: engine-temperature-high
    description: >-
      An engine's coolant temperature stays above 95 °C for 30 seconds, a
      warning, and climbs to an alarm above 100 °C.
    open: [instance]
    condition: temperatureHigh
    rule:
      name: Engine ${instance} temperature high
      message: 'Engine ${instance} temperature above {limit}: {value}'
      signal:
        path: propulsion.${instance}.temperature
      detector:
        type: sustained
        direction: above
        steps:
          - { limit: 368.15, priority: warning }
          - { limit: 373.15, priority: alarm }
        duration: 30
        hysteresis: 2

  # Oil pressure is low whenever the engine is stopped, so these rules apply
  # only once it has run for a while, which also lets pressure build after a
  # start.
  - id: engine-oil-pressure-low
    description: >-
      While an engine runs, its oil pressure stays below 1 bar for 10
      seconds, a warning, and climbs to an alarm below 0.5 bar.
    open: [instance]
    condition: oilPressureLow
    rule:
      name: Engine ${instance} oil pressure low
      message: 'Engine ${instance} oil pressure below {limit}: {value}'
      signal:
        path: propulsion.${instance}.oilPressure
      detector:
        type: sustained
        direction: below
        steps:
          - { limit: 100000, priority: warning }
          - { limit: 50000, priority: alarm }
        duration: 10
      # Running means above 480 rpm, between a diesel's cranking speed and
      # its idle. Holding it for 30 seconds lets oil pressure build after a
      # start.
      gates:
        - signal:
            path: propulsion.${instance}.revolutions
          direction: above
          limit: { kind: fixed, value: 8 }
          duration: 30

  # A charging alternator holds a 12 V system above about 13.5 V; at rest a
  # battery sits below 13 V.
  - id: alternator-not-charging
    description: >-
      While an engine runs, its alternator's voltage stays below 13.0 V for
      two minutes, a warning that it is not charging.
    open: [instance]
    condition: alternatorNotCharging
    rule:
      name: Engine ${instance} alternator not charging
      message: 'Engine ${instance} alternator not charging: {value}'
      signal:
        path: propulsion.${instance}.alternatorVoltage
      detector:
        type: sustained
        direction: below
        steps:
          - { limit: 13.0, priority: warning }
        duration: 120
      # The oil pressure gate: running above 480 rpm for 30 seconds. A
      # regulator's delay before it starts charging is covered by the
      # two-minute duration, so the gate needs no longer hold.
      gates:
        - signal:
            path: propulsion.${instance}.revolutions
          direction: above
          limit: { kind: fixed, value: 8 }
          duration: 30

  # Counts running time from when the rule is created; resetting its total
  # after the service starts the next interval.
  - id: engine-service-due
    description: >-
      An engine has run 250 hours, a caution that service is due, and 275
      hours, a warning that it is overdue.
    open: [instance]
    condition: serviceDue
    rule:
      name: Engine ${instance} service due
      message: Engine ${instance} service is due
      signal:
        path: propulsion.${instance}.revolutions
      detector:
        type: accumulator
        measure: time
        while: { op: above, value: 0 }
        steps:
          - { limit: 900000, priority: caution }
          - { limit: 990000, priority: warning }
